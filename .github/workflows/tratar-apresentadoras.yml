name: Tratamento das apresentadoras

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tratamento-apresentadoras
  cancel-in-progress: false

jobs:
  tratar-imagens:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python e Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Ampliar e melhorar as imagens sem alterar os originais
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageEnhance, ImageFilter

          sources = [
              "assets/lia-desenhos.png.",
              "assets/helena-classicos.png",
              "assets/ayla-aventura.png",
              "assets/raven-acao.png",
              "assets/clara-acessivel.png",
              "assets/bia-libras.png",
              "assets/maya-romance.png",
              "assets/eduarda-educacao.png",
              "assets/vivi-trailers.png",
          ]

          output_dir = Path("assets/tratadas")
          output_dir.mkdir(parents=True, exist_ok=True)

          for source in sources:
              path = Path(source)
              if not path.is_file():
                  raise SystemExit(f"Imagem não encontrada: {source}")

              with Image.open(path) as original:
                  image = ImageOps.exif_transpose(original).convert("RGB")
                  old_size = image.size
                  image = image.resize(
                      (old_size[0] * 2, old_size[1] * 2),
                      Image.Resampling.LANCZOS
                  )
                  image = ImageEnhance.Contrast(image).enhance(1.035)
                  image = ImageEnhance.Color(image).enhance(1.025)
                  image = image.filter(
                      ImageFilter.UnsharpMask(radius=1.25, percent=115, threshold=3)
                  )

                  output_name = path.name
                  if output_name.endswith(".png."):
                      output_name = output_name[:-1]
                  output_name = Path(output_name).stem + ".webp"
                  destination = output_dir / output_name

                  image.save(destination, "WEBP", quality=94, method=6)
                  print(
                      f"{source}: {old_size[0]}x{old_size[1]} -> "
                      f"{image.width}x{image.height} | {destination}"
                  )

          readme = output_dir / "README.md"
          readme.write_text(
              "# Apresentadoras - imagens tratadas\n\n"
              "Versões WebP ampliadas em 2x com reamostragem Lanczos, "
              "ajuste leve de contraste/cor e nitidez.\n"
              "Os arquivos originais em assets/ foram preservados. "
              "O tratamento melhora a apresentação, mas não recupera "
              "detalhes que não existiam nas imagens de origem.\n",
              encoding="utf-8"
          )
          PY

      - name: Publicar versões tratadas no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Adicionar versões tratadas das apresentadoras"
          file_pattern: "assets/tratadas/*"
